<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Glow</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1030;
    --panel: #251646;
    --grid: #ffffff0d;
    --ink: #f3eaff;
    --muted: #a995d6;
    --food: #ff5d8f;
    --a: #5ef0ff;
    --b: #9b6bff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 20%, #34196b 0%, var(--bg) 65%);
    color: var(--ink);
    font-family: 'Sora', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 12px; user-select: none; -webkit-user-select: none;
  }
  h1 {
    font-family: 'Bungee', Impact, sans-serif; font-weight: 400; margin: 0;
    font-size: clamp(28px, 7vw, 44px); letter-spacing: 1px;
    background: linear-gradient(90deg, var(--a), var(--b));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hud { display: flex; gap: 12px; width: min(92vw, 480px); }
  .stat { flex: 1; background: var(--panel); border-radius: 12px; padding: 8px 14px; }
  .stat small { display: block; color: var(--muted); font-size: 12px; }
  .stat b { font-family: 'Bungee', Impact, sans-serif; font-weight: 400; font-size: 22px; }
  .stage { position: relative; width: min(92vw, 480px); aspect-ratio: 1; }
  canvas {
    width: 100%; height: 100%; display: block; border-radius: 18px;
    background: #140b27; box-shadow: 0 0 0 2px #ffffff14, 0 20px 60px #0008;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; border-radius: 18px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: #140b27cc; backdrop-filter: blur(3px); padding: 20px;
  }
  .overlay.hide { display: none; }
  .overlay h2 { font-family: 'Bungee', Impact, sans-serif; font-weight: 400; margin: 0; font-size: clamp(26px, 7vw, 38px); }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  button {
    font-family: 'Bungee', Impact, sans-serif; font-size: 18px; color: #1a1030; border: 0;
    padding: 12px 28px; border-radius: 999px; cursor: pointer; margin-top: 6px;
    background: linear-gradient(90deg, var(--a), var(--b));
    transition: transform .12s;
  }
  button:hover { transform: scale(1.05); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .hint { color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
  <h1>Snake Glow</h1>
  <div class="hud">
    <div class="stat"><small>Skor</small><b id="score">0</b></div>
    <div class="stat"><small>Rekor</small><b id="best">0</b></div>
  </div>
  <div class="stage">
    <canvas id="c" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">Siap main?</h2>
      <p id="msg">Makan bola pink, jangan nabrak dinding atau badanmu sendiri.</p>
      <button id="go">Mulai</button>
    </div>
  </div>
  <div class="hint">Panah / WASD untuk belok, Spasi untuk jeda. Di HP: geser layar.</div>

<script>
(() => {
  const N = 20, S = 24;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay'), titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg'), goBtn = document.getElementById('go');

  let best = 0;
  try { best = +localStorage.getItem('snakeGlowBest') || 0; } catch (e) {}
  bestEl.textContent = best;

  let snake, prev, dir, queue, food, score, speed, acc, state = 'ready', parts = [], shake = 0, pulse = 0;

  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    prev = snake.map(p => ({...p}));
    dir = {x:1,y:0}; queue = [];
    score = 0; speed = 8; acc = 0; parts = [];
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    do { food = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)}; }
    while (snake.some(p => p.x === food.x && p.y === food.y));
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 160;
      parts.push({x:(x+.5)*S, y:(y+.5)*S, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, color});
    }
  }

  function step() {
    if (queue.length) {
      const d = queue.shift();
      if (d.x !== -dir.x || d.y !== -dir.y) dir = d;
    }
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    const hit = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
                snake.slice(0, -1).some(p => p.x === head.x && p.y === head.y);
    if (hit) return die();
    prev = snake.map(p => ({...p}));
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++; scoreEl.textContent = score;
      speed = Math.min(18, 8 + score * 0.35);
      burst(food.x, food.y, '#ff5d8f', 22);
      placeFood();
    } else snake.pop();
  }

  function die() {
    state = 'over'; shake = 14;
    burst(snake[0].x, snake[0].y, '#5ef0ff', 40);
    const isBest = score > best;
    if (isBest) { best = score; bestEl.textContent = best; try { localStorage.setItem('snakeGlowBest', best); } catch (e) {} }
    titleEl.textContent = isBest && score > 0 ? 'Rekor baru!' : 'Game over';
    msgEl.textContent = 'Skor kamu ' + score + '. Coba lagi?';
    goBtn.textContent = 'Main lagi';
    setTimeout(() => { if (state === 'over') overlay.classList.remove('hide'); }, 600);
  }

  function start() {
    reset(); state = 'play'; overlay.classList.add('hide');
  }

  function togglePause() {
    if (state === 'play') {
      state = 'paused'; titleEl.textContent = 'Jeda'; msgEl.textContent = 'Tekan Spasi atau tombol untuk lanjut.';
      goBtn.textContent = 'Lanjut'; overlay.classList.remove('hide');
    } else if (state === 'paused') { state = 'play'; overlay.classList.add('hide'); }
  }

  function turn(x, y) {
    if (state !== 'play') return;
    const last = queue.length ? queue[queue.length-1] : dir;
    if ((x === last.x && y === last.y) || (x === -last.x && y === -last.y)) return;
    if (queue.length < 2) queue.push({x, y});
  }

  goBtn.addEventListener('click', () => state === 'paused' ? togglePause() : start());

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const map = {arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1], arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0]};
    if (map[k]) { e.preventDefault(); turn(...map[k]); }
    else if (k === ' ') { e.preventDefault(); if (state === 'play' || state === 'paused') togglePause(); else if (document.activeElement !== goBtn) start(); }
    else if (k === 'enter' && (state === 'ready' || state === 'over') && document.activeElement !== goBtn) start();
  });

  let t0 = null;
  cv.addEventListener('touchstart', e => { t0 = e.touches[0]; }, {passive:true});
  cv.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
    t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    Math.abs(dx) > Math.abs(dy) ? turn(dx > 0 ? 1 : -1, 0) : turn(0, dy > 0 ? 1 : -1);
  });

  function lerp(a, b, t) { return a + (b - a) * t; }

  function draw(t, dt) {
    ctx.save();
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (shake > 0) { ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= 0.88; if (shake < .5) shake = 0; }

    ctx.strokeStyle = '#ffffff0d'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < N; i++) { ctx.moveTo(i*S, 0); ctx.lineTo(i*S, N*S); ctx.moveTo(0, i*S); ctx.lineTo(N*S, i*S); }
    ctx.stroke();

    // food
    pulse += dt * 5;
    const r = S * (0.28 + 0.05 * Math.sin(pulse));
    ctx.shadowColor = '#ff5d8f'; ctx.shadowBlur = 22; ctx.fillStyle = '#ff5d8f';
    ctx.beginPath(); ctx.arc((food.x+.5)*S, (food.y+.5)*S, r, 0, 7); ctx.fill();

    // snake
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const p = snake[i], q = prev[Math.min(i, prev.length - 1)];
      const x = lerp(q.x, p.x, t) * S, y = lerp(q.y, p.y, t) * S;
      const k = i / Math.max(1, n - 1);
      const g = Math.round(lerp(240, 155, k)), bch = Math.round(lerp(255, 255, k));
      ctx.shadowColor = i === 0 ? '#5ef0ff' : '#9b6bff';
      ctx.shadowBlur = i === 0 ? 20 : 10;
      ctx.fillStyle = `rgb(${Math.round(lerp(94,155,k))},${Math.round(lerp(240,107,k))},${bch})`;
      const pad = i === 0 ? 1 : 2 + k * 3;
      ctx.beginPath(); ctx.roundRect(x + pad, y + pad, S - pad*2, S - pad*2, 8); ctx.fill();
    }
    // eyes
    ctx.shadowBlur = 0; ctx.fillStyle = '#1a1030';
    const hx = lerp(prev[0].x, snake[0].x, t) * S + S/2, hy = lerp(prev[0].y, snake[0].y, t) * S + S/2;
    const px = -dir.y, py = dir.x;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(hx + dir.x*5 + px*5*s, hy + dir.y*5 + py*5*s, 2.6, 0, 7); ctx.fill();
    }

    // particles
    for (const p of parts) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.8;
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    parts = parts.filter(p => p.life > 0);
    ctx.restore();
  }

  reset();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state === 'play') {
      acc += dt;
      const tick = 1 / speed;
      while (acc >= tick && state === 'play') { acc -= tick; step(); }
    }
    const t = state === 'play' ? Math.min(1, acc * speed) : 1;
    draw(t, dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
